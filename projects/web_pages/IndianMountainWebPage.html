<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndianMountainWebPage</title>
    <link rel="stylesheet" href="IndianMountainWebPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <input type="checkbox" name="CheckBox" id="check_box" class="check">
    <nav id="navbar_container">
        <ul id="navbar_list_container">
            <li class="navbar_list_items">Home</li>
            <li class="navbar_list_items">About Us</li>
            <li class="navbar_list_items">Contact</li>
            <li class="navbar_list_items">
                <label for="check_box" id="login_label">Login</label>
            </li>
        </ul>
    </nav>
    <div class="indian_mountain_headings" id="indian_mountains_container">
        <div id="left_indian_mountain_container">
            <h1 class="headings up_headings left_indian_mountain_headings" id="ind_heading">IND</h1>
            <h1 class="headings down_heading left_indian_mountain_headings" id="moun_heading">MOUN</h1>
        </div>
        <div class="indian_mountain_headings" id="right_indian_mountain_container">
            <h1 class="headings up_headings right_indian_mountain_headings" id="ian_heading">IAN</h1>
            <h1 class="headings down_heading right_indian_mountain_headings" id="ntain_heading">NTAIN</h1>

        </div>
    </div>
    <div id="buttons_container">
        <button class="buttons"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="buttons"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <form action="" id="login_form_container">
        <h1 id="login_heading">Login.</h1>
        <input type="text" name="UserName" id="username_input_field" class="input_fields" placeholder="UserName">
        <input type="password" name="Password" id="password_input_field" class="input_fields" placeholder="Password">
        <input type="submit" value="LOGIN" id="login_button">
    </form>
</body>
</html>
