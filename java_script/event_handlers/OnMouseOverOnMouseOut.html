<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnMouseOverOnMouseOutEventHandler</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #planets_images_container{
            width: 20vw;
            height: 20vw;
            background-color: gray;
            background-image: url(../../assets/images/Sun.PNG);
            cursor: pointer;
            background-size: 128%;
            background-position: center;
            border-radius: 50%;
            box-shadow: 0px 0px 10px black,0px 0px 20px black;
        }
    </style>
    <script src="OnMouseOverOnMouseOut.js" defer></script>
</head>
<body>
    <div id="planets_images_container" onmouseover="changePlanetImage()" onmouseout="changePlanetImage()"></div>
</body>
</html>
