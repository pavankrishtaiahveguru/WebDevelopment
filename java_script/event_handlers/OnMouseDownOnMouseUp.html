<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnMouseDownOnMouseUpEventHandler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="OnMouseDownOnMouseUp.js" defer></script>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: ProductScans;
        }
        @font-face {
            font-family: ProductScans;
            src: url(../../assets/fonts/ProductSansRegular.ttf);
        }
        body{
            padding: 20px;
        }
        #password_input_box{
            font-size: 2.5vw;
            background-color: lightgray;
            border-radius: 15px;
            outline: none;
            border: none;
            padding:5px 15px ;
        }
        #eye_icon_container{
            font-size: 2vw;
            position: relative;
            left: -3.5vw;
            top: -0.35vh;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input type="password" name="Password" id="password_input_box">
    <span id="eye_icon_container" onmousedown="showPassword()" onmouseup="hidePassword()">
        <i class="fa-solid fa-eye" id="eye_icon"></i>
    </span>
</body>
</html>
