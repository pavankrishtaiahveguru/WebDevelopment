<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnFocusOnBlurEventHandler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: ProductScans;
        }
        @font-face {
            font-family: ProductScans;
            src: url(../../assets/fonts/ProductSansRegular.ttf);
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #search_icons{
            width: 70vw;
            height: 70px;
            font-size: 2.5vw;
            font-weight: bold;
            padding-left: 100px;
            border: 3px solid black;
            border-radius: 50px;
            outline: none;
        }
        #search_icon{
            font-size: 2.5vw;
            position: relative;
            left: 70px;
        }
    </style>
    <script src="OnFocusOnBlur.js" defer></script>
</head>
<body>
    <i class="fa-solid fa-magnifying-glass" id="search_icon"></i>
    <input type="text" name="SearchIcons" id="search_icons" onfocus="searchIcons()" placeholder="Search 63,199 icons..." onfocus="searchIcons()" onblur="removeSearchOutline()">
</body>
</html>
